name: Publish Arms Bridge release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tools/publish_release.py
      - tools/build_release.py
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# All versions share the publisher, preventing simultaneous tag/asset writers.
# A cancelled upload can be resumed, but an in-progress publication is not evicted.
concurrency:
  group: arms-bridge-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'murillo128/fg-arms-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARMSBRIDGE_LUA: lua5.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and existing publication
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py --preflight
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.preflight.outputs.publish == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manual/requirements.txt
      - name: Install build dependencies
        if: steps.preflight.outputs.publish == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          python3 -m pip install -r manual/requirements.txt
      - name: Validate product and build release artifacts
        if: steps.preflight.outputs.publish == 'true'
        run: python3 tools/build_release.py
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: steps.preflight.outputs.publish == 'true'
        with:
          version: '1.3.4'
      - name: Publish and verify OCI packages and Release downloads
        if: steps.preflight.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py
